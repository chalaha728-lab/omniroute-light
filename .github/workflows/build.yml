name: "Build OmniRoute Lightweight"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            ext: '.exe'
          - platform: 'macos-latest'
            ext: ''
          - platform: 'ubuntu-22.04'
            ext: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Create sidecar binaries directory
        run: mkdir -p src-tauri/binaries

      - name: Compile Go Proxy Sidecar
        run: |
          cd core
          go build -ldflags="-s -w" -o ../src-tauri/binaries/omniroute-core-${{ matrix.platform }}${{ matrix.ext }} main.go

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'OmniRoute Lightweight v__VERSION__'
          releaseBody: 'Automated Cloud Build for OmniRoute Lightweight'
          releaseDraft: true
          prerelease: false
