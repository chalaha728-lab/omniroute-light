name: "Build OmniRoute Lightweight"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            ext: '.exe'
            goos: 'windows'
            goarch: 'amd64'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            ext: ''
            goos: 'darwin'
            goarch: 'arm64'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            ext: ''
            goos: 'linux'
            goarch: 'amd64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Generate App Icon PNG
        run: node scripts/generate-icon.cjs

      - name: Generate Native Icons from PNG
        run: npx @tauri-apps/cli icon app-icon.png

      - name: Create sidecar binaries directory
        run: mkdir -p src-tauri/binaries

      - name: Compile Go Proxy Sidecar
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd core
          go build -ldflags="-s -w" -o ../src-tauri/binaries/omniroute-core-${{ matrix.target }}${{ matrix.ext }} main.go

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'OmniRoute Lightweight v__VERSION__'
          releaseBody: 'Automated Cloud Build for OmniRoute Lightweight'
          releaseDraft: true
          prerelease: false
